    <path d="M34 174 l6 6 l10 -11" fill="none" stroke="#3F6E71" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="184" font-size="15.5" fill="#2E4048">Knowledge checked against safety documents</text><path d="M34 202 l6 6 l10 -11" fill="none" stroke="#3F6E71" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="212" font-size="15.5" fill="#2E4048">Every answer points to where it came from</text><path d="M34 230 l6 6 l10 -11" fill="none" stroke="#3F6E71" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="240" font-size="15.5" fill="#2E4048">Nothing reaches a worker until a human approves</text><rect x="32" y="262" width="69" height="28" rx="14" fill="#9CC2BF" fill-opacity=".35"/><text x="66.5" y="281" font-size="13" font-weight="700" fill="#3F6E71" text-anchor="middle">Python</text><rect x="109" y="262" width="77" height="28" rx="14" fill="#9CC2BF" fill-opacity=".35"/><text x="147.5" y="281" font-size="13" font-weight="700" fill="#3F6E71" text-anchor="middle">FastAPI</text><rect x="194" y="262" width="46" height="28" rx="14" fill="#9CC2BF" fill-opacity=".35"/><text x="217.0" y="281" font-size="13" font-weight="700" fill="#3F6E71" text-anchor="middle">RAG</text><rect x="248" y="262" width="62" height="28" rx="14" fill="#9CC2BF" fill-opacity=".35"/><text x="279.0" y="281" font-size="13" font-weight="700" fill="#3F6E71" text-anchor="middle">React</text>
