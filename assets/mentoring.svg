ll="#E6B19D" opacity=".55"/><rect x="611" y="22" width="565" height="8" fill="#E6B19D" opacity=".55"/><circle cx="1122" cy="82" r="32" fill="#E6B19D" fill-opacity=".4"/><g><animateTransform attributeName="transform" type="translate" values="0 2;0 -3;0 2" dur="2.4s" repeatCount="indefinite"/><path d="M1122 62 Q1133 74 1130 90 L1114 90 Q1111 74 1122 62 Z" fill="#A35E4A"/><circle cx="1122" cy="77" r="3.5" fill="#FBF8F2"/><path d="M1114 84 L1108 92 L1114 90 Z M1130 84 L1136 92 L1130 90 Z" fill="#A35E4A"/></g><path d="M1118 93 L1122 102 L1126 93 Z" fill="#E6CF9F"><animate attributeName="opacity" values="1;.3;1" dur=".5s" repeatCount="indefinite"/></path><text x="639" y="70" font-size="12.5" font-weight="800" letter-spacing="2.5" fill="#A35E4A">MISSION READY HQ</text><text x="639" y="104" font-size="25" font-weight="800" fill="#2E4048">Cohort mentor</text><text x="639" y="140" font-size="15.5" fill="#6B7C83">Mentoring cohorts of new developers on</text><text x="639" y="163" font-size="15.5" fill="#6B7C83">the same programme that got me into</text><text x="639" y="186" font-size="15.5" fill="#6B7C83">software: code reviews, team projects,</text><text x="639" y="209" font-size="15.5" fill="#6B7C83">Git habits and shipping real products.</text><text x="639" y="246" font-size="15.5" font-style="italic" font-weight="700" fill="#A35E4A">Paying it forward, one cohort at a time.</text>
